[workspace]
resolver = "2"
members = ["crates/wallet-core", "crates/wallet-cli", "crates/wallet-litvm", "src-tauri"]

[workspace.package]
edition = "2021"
rust-version = "1.96.0"
license = "MIT OR Apache-2.0"

# Until crates.io publishes litecoin 0.32.8-rc.2 (native PSBTv2 MWEB maps).
# Must stay on the same rev the bdk fork pins, so litecoin types unify.
[patch.crates-io]
litecoin = { git = "https://github.com/LitecoinDevKit/rust-litecoin.git", rev = "5a0233712bdefc568fb45d71f42c028e196c4352" }
