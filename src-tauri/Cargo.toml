[package]
name = "ltc-wallet"
version = "0.4.6"
description = "Native Litecoin wallet for macOS and Linux (Tauri shell)"
authors = ["IndigoNakamoto"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "ltc_wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["litvm"]
litvm = ["dep:wallet-litvm"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
wallet-core = { path = "../crates/wallet-core" }
wallet-litvm = { path = "../crates/wallet-litvm", optional = true }
